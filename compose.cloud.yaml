secrets:
  build-ca:
    file: ${BUILD_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}
services:
  gateway:
    build:
      secrets: [build-ca]
  mqtt-subscriber:
    build:
      secrets: [build-ca]
  sensor-rest:
    build:
      secrets: [build-ca]
  sensor-grpc:
    build:
      secrets: [build-ca]
  sensor-web:
    build:
      secrets: [build-ca]
